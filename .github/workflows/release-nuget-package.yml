name: release-nuget-package

on:
  push:
    tags:
      - "[0-999]+.[0-999]+.[0-999]"
      - "[0-999]+.[0-999]+.[0-999]+-*"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update NuGet package
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8'
          source-url: https://nuget.pkg.github.com/tigertext/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set PACKAGE_VERSION to Env
        run: echo "PACKAGE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - run: dotnet build src/WorkflowCore/WorkflowCore.csproj
      - run: dotnet build src/providers/WorkflowCore.Providers.AWS/WorkflowCore.Providers.AWS.csproj
      - name: Create the packages
        run: |
          dotnet pack src/WorkflowCore/WorkflowCore.csproj --configuration Release /p:Version=${PACKAGE_VERSION}
          dotnet pack src/providers/WorkflowCore.Providers.AWS/WorkflowCore.Providers.AWS.csproj --configuration Release /p:Version=${PACKAGE_VERSION}
      - name: Publish package
        run: |
          find src/WorkflowCore/bin/Release src/providers/WorkflowCore.Providers.AWS/bin/Release -name "TigerConnect.WorkflowCore*.nupkg" -type f | while read package; do
            echo "Publishing $package"
            dotnet nuget push "$package"
          done
